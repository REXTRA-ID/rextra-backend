openapi: 3.0.3
info:
  title: Rextra Backend - Kenali Diri Admin API
  version: "1.0.0"
  description: >
    OpenAPI spec for Kenali Diri admin endpoints (test history, feedback, RIASEC master)
    implemented in the backend. All endpoints require Bearer JWT with ADMIN role.
servers:
  - url: http://localhost:8000
    description: Local development
security:
  - bearerAuth: []
paths:
  /api/v1/admin/kenali-diri/history:
    get:
      summary: List test history
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: category_id
          schema: { type: integer, format: int64 }
        - in: query
          name: status
          schema:
            type: string
            enum: [ongoing, completed, abandoned]
        - in: query
          name: user_name
          schema: { type: string }
        - in: query
          name: start_date
          description: Filter by started_at >= (RFC3339)
          schema: { type: string, format: date-time }
        - in: query
          name: end_date
          description: Filter by started_at <= (RFC3339)
          schema: { type: string, format: date-time }
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [name_asc, name_desc, date_asc, date_desc]
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestHistoryListSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
    delete:
      summary: Bulk delete test data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteTestDataRequest"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/history/{id}:
    get:
      summary: Get test detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestDetailSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/history/export:
    post:
      summary: Export test history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportTestHistoryRequest"
      responses:
        "200":
          description: Export created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportFileSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/feedback/student:
    get:
      summary: List student feedback
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: category_id
          schema: { type: integer, format: int64 }
        - in: query
          name: user_name
          schema: { type: string }
        - in: query
          name: has_obstacles
          description: Filter feedback that reports obstacles
          schema: { type: boolean }
        - in: query
          name: sort_by
          schema: { type: string }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackListSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/feedback/student/stats:
    get:
      summary: Student feedback stats
      parameters:
        - in: query
          name: category_id
          schema: { type: integer, format: int64 }
        - in: query
          name: time_range
          schema:
            type: string
            enum: [mingguan, bulanan, sepanjang_waktu]
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/feedback/expert:
    get:
      summary: List expert feedback
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: category_id
          schema: { type: integer, format: int64 }
        - in: query
          name: expert_name
          schema: { type: string }
        - in: query
          name: top_n_status
          schema:
            type: string
            enum: [P1, P2, P3-5, not_found]
        - in: query
          name: sort_by
          schema: { type: string }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertFeedbackListSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/feedback/expert/{id}:
    get:
      summary: Get expert feedback detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpertFeedbackDetailSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/riasec-codes:
    get:
      summary: List RIASEC codes
      parameters:
        - in: query
          name: code_type
          schema:
            type: string
            enum: [single, dual, triple]
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiasecCodeListSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/admin/kenali-diri/riasec-codes/{id}:
    get:
      summary: Get RIASEC code detail
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiasecCodeDetailSuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
    put:
      summary: Update RIASEC code
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRiasecCodeRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageOnlySuccess"
        default:
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    # Envelopes
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
        error:
          nullable: true
        error_code:
          nullable: true
        meta:
          nullable: true
      required: [success, message]
    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        error:
          type: string
        error_code:
          nullable: true
      required: [success, message]

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        total_pages: { type: integer }
        total_records: { type: integer, format: int64 }
        per_page: { type: integer }

    # Test history
    TestHistoryItem:
      type: object
      properties:
        test_id: { type: string, example: PK123 }
        user_name: { type: string }
        category_name: { type: string }
        status: { type: string, enum: [ongoing, completed, abandoned] }
        result_code: { type: string }
        riasec_code_type: { type: string, enum: [single, dual, triple] }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
    TestHistoryListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestHistoryItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    TestHistoryListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TestHistoryListData"

    RiasecResultDetail:
      type: object
      properties:
        score_r: { type: integer }
        score_i: { type: integer }
        score_a: { type: integer }
        score_s: { type: integer }
        score_e: { type: integer }
        score_c: { type: integer }
        riasec_code: { type: string }
        riasec_title: { type: string }
        classification_type: { type: string }
        is_inconsistent: { type: boolean }
    IkigaiResultDetail:
      type: object
      properties:
        love_narrative: { type: string }
        good_at_narrative: { type: string }
        world_needs_narrative: { type: string }
        paid_for_narrative: { type: string }
    RecommendationDetail:
      type: object
      properties:
        rank: { type: integer }
        profession_id: { type: integer, format: int64 }
        profession_name: { type: string }
        match_percentage: { type: integer }
        match_reasoning: { type: string }
    TestDetailData:
      type: object
      properties:
        test_id: { type: string }
        user_name: { type: string }
        category_name: { type: string }
        status: { type: string }
        started_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time, nullable: true }
        riasec_result:
          $ref: "#/components/schemas/RiasecResultDetail"
        ikigai_result:
          $ref: "#/components/schemas/IkigaiResultDetail"
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/RecommendationDetail"
    TestDetailSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TestDetailData"

    # Feedback (student)
    FeedbackItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        user_name: { type: string }
        ease_of_use_score: { type: integer, minimum: 1, maximum: 7 }
        relevance_score: { type: integer, minimum: 1, maximum: 7 }
        satisfaction_score: { type: integer, minimum: 1, maximum: 7 }
        obstacles:
          type: array
          items: { type: string }
        submitted_at: { type: string, format: date-time }
    FeedbackListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/FeedbackItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    FeedbackListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FeedbackListData"

    FeedbackStatsData:
      type: object
      properties:
        total_feedback: { type: integer }
        avg_ease_of_use: { type: number, format: double }
        avg_relevance: { type: number, format: double }
        avg_satisfaction: { type: number, format: double }
        participation_rate: { type: number, format: double }
        trend_data:
          type: object
          additionalProperties: true
    FeedbackStatsSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/FeedbackStatsData"

    # Feedback (expert)
    ExpertFeedbackItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        expert_name: { type: string }
        profession: { type: string }
        top_n_status:
          type: string
          enum: [P1, P2, P3-5, not_found]
        accuracy_score: { type: integer, minimum: 1, maximum: 7 }
        logic_score: { type: integer, minimum: 1, maximum: 7 }
        benefit_score: { type: integer, minimum: 1, maximum: 7 }
        obstacles:
          type: array
          items: { type: string }
        submitted_at: { type: string, format: date-time }
    ExpertFeedbackListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ExpertFeedbackItem"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ExpertFeedbackListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExpertFeedbackListData"

    ExpertFeedbackDetailData:
      type: object
      properties:
        id: { type: integer, format: int64 }
        expert_name: { type: string }
        profession: { type: string }
        degree: { type: string }
        experience: { type: string }
        education: { type: string }
        university: { type: string }
        study_program: { type: string }
        category_test: { type: string }
        top_five_professions:
          type: array
          items: { type: string }
        top_n_status:
          type: string
          enum: [P1, P2, P3-5, not_found]
        accuracy_score: { type: integer }
        logic_score: { type: integer }
        benefit_score: { type: integer }
        obstacles:
          type: array
          items: { type: string }
        suggestions: { type: string }
        submitted_at: { type: string, format: date-time }
    ExpertFeedbackDetailSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExpertFeedbackDetailData"

    # RIASEC master
    RiasecCodeItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        code_type:
          type: string
          enum: [single, dual, triple]
    RiasecCodeListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RiasecCodeItem"
        total_codes: { type: integer }
    RiasecCodeListSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RiasecCodeListData"

    RiasecCodeDetail:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        strengths:
          type: array
          items: { type: string }
        challenges:
          type: array
          items: { type: string }
        strategies:
          type: array
          items: { type: string }
        work_environments:
          type: array
          items: { type: string }
        interaction_styles:
          type: array
          items: { type: string }
    RiasecCodeDetailSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/RiasecCodeDetail"

    # Requests
    DeleteTestDataRequest:
      type: object
      required: [test_ids]
      properties:
        test_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
    ExportTestHistoryRequest:
      type: object
      properties:
        category_id: { type: integer, format: int64 }
        status:
          type: string
          enum: [ongoing, completed, abandoned]
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        format:
          type: string
          enum: [csv, excel, pdf]
      required: [format]
    UpdateRiasecCodeRequest:
      type: object
      required:
        - riasec_title
        - riasec_description
        - strengths
        - challenges
        - strategies
        - work_environments
        - interaction_styles
      properties:
        riasec_title: { type: string }
        riasec_description: { type: string }
        strengths:
          type: array
          minItems: 1
          items: { type: string }
        challenges:
          type: array
          minItems: 1
          items: { type: string }
        strategies:
          type: array
          minItems: 1
          items: { type: string }
        work_environments:
          type: array
          minItems: 1
          items: { type: string }
        interaction_styles:
          type: array
          minItems: 1
          items: { type: string }

    # Export response
    ExportFileData:
      type: object
      properties:
        file_name: { type: string }
        file_url: { type: string, format: uri }
        exported_at: { type: string, format: date-time }
        total_records: { type: integer }
    ExportFileSuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExportFileData"

    MessageOnlySuccess:
      allOf:
        - $ref: "#/components/schemas/SuccessEnvelope"
