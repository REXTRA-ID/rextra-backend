services:
  rextra-backend-dev:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    container_name: ${APP_NAME:-rextra-backend}-dev
    volumes:
      - .:/app
    ports:
      - ${APP_PORT:-8000}:8000
    environment:
      - APP_MODE=development
      - APP_PORT=${APP_PORT:-8000}
    networks:
      - rextra-backend-dev-network

  db-dev:
    image: postgres:latest
    container_name: ${APP_NAME:-rextra-backend}-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-rextra}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - rextra-backend-dev-network

  nginx-dev:
    image: nginx:latest
    container_name: ${APP_NAME:-rextra-backend}-nginx-dev
    volumes:
      - .:/var/www/html
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${NGINX_PORT:-81}:80
    depends_on:
      - rextra-backend-dev
    networks:
      - rextra-backend-dev-network

volumes:
  db-data:

networks:
  rextra-backend-dev-network:
    driver: bridge