services:
  app:
    image: ${IMAGE_NAME:-rextra-backend-dev:latest}
    container_name: ${APP_NAME:-rextra-backend}-dev
    hostname: app-dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    ports:
      - ${APP_PORT:-8001}:8001
    environment:
      - APP_MODE=development
      - APP_PORT=${APP_PORT:-8001}
      - DB_HOST=172.20.0.10
      - DB_USER=${DB_USER:-postgres}
      - DB_PASS=${DB_PASS:-password}
      - DB_NAME=${DB_NAME:-rextra}
      - DB_PORT=5432
    networks:
      app-dev-network:
        ipv4_address: 172.20.0.11

  db:
    image: postgres:15-alpine
    container_name: ${APP_NAME:-rextra-backend}-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-rextra}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-rextra}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      app-dev-network:
        ipv4_address: 172.20.0.10

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME:-rextra-backend}-nginx-dev
    volumes:
      - .:/var/www/html
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${NGINX_PORT:-81}:80
    depends_on:
      - app
    networks:
      - app-dev-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: ${APP_NAME:-rextra-backend}-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rextra.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 5050:80
    networks:
      - app-dev-network

volumes:
  db-data:

networks:
  app-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
