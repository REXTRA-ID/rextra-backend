services:
  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    container_name: ${APP_NAME:-rextra-backend}-dev
    volumes:
      - .:/app
    ports:
      - ${APP_PORT:-8001}:8001
    depends_on:
      - db
    environment:
      - APP_MODE=development
      - APP_PORT=${APP_PORT}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    networks:
      - app-dev-network

  db:
    image: postgres:16
    container_name: ${APP_NAME:-rextra-backend}-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-rextra}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - app-dev-network

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME:-rextra-backend}-nginx-dev
    volumes:
      - .:/var/www/html
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${NGINX_PORT:-81}:80
    depends_on:
      - app
    networks:
      - app-dev-network

volumes:
  db-data:

networks:
  app-dev-network:
    driver: bridge
