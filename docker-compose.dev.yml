services:
  app:
    build:
      context: .
      dockerfile: ./docker/dev/Dockerfile
    container_name: ${APP_NAME:-rextra-backend}-dev
    volumes:
      - .:/app
    ports:
      - ${APP_PORT:-8081}:8080
    depends_on:
      - db
    env_file: .env.dev
    networks:
      - app-dev-network

  db:
    image: postgres:16
    container_name: ${APP_NAME:-rextra-backend}-db-dev
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-rextra}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5433:5432
    networks:
      - app-dev-network

  nginx:
    image: nginx:latest
    container_name: ${APP_NAME:-rextra-backend}-nginx-dev
    volumes:
      - .:/var/www/html
      - ./docker/dev/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - ${NGINX_PORT:-81}:80
    depends_on:
      - app
    networks:
      - app-dev-network

volumes:
  db-data:

networks:
  app-dev-network:
    driver: bridge
