services:
  app:
    build:
      context: .
      dockerfile: ./docker/local/Dockerfile
    container_name: rextra-backend-local
    volumes:
      - .:/app
    ports:
      - ${APP_PORT:-8080}:8080
    depends_on:
      - db
    env_file: .env.dev
    networks: # <--- TAMBAHAN PENTING
      - rextra-net

  db:
    image: postgres:16
    container_name: rextra-backend-db-local
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-rextra}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - rextra-net

volumes:
  db-data:

networks:
  rextra-net:
    external: true
