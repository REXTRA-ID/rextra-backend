name: Deploy dev to VPS

on:
  push:
    branches: [dev, fix-checkout-final]

jobs:
  build:
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Connect to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          file: ./docker/dev/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/rextra-backend-dev:latest
            ${{ secrets.DOCKER_USERNAME }}/rextra-backend-dev:${{ github.run_number }}
          labels: "org.opencontainers.image.revision=${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test Network Connectivity
        run: |
          echo "Attempting to connect to host ${{ secrets.VPS_HOST }} on port ${{ secrets.VPS_PORT }}"
          nc -zv ${{ secrets.VPS_HOST }} ${{ secrets.VPS_PORT }}

      - name: Deploy to development environment
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /home/rextra/rextra-backend
            git pull origin dev

            export IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/rextra-backend-dev:${{ github.run_number }}
            export IMAGE_TAG=${{ github.run_number }}

            docker pull $IMAGE_NAME
            make down ENV=dev
            make up ENV=dev
            
            echo "Waiting for container to be ready..."
            sleep 15
            
            # Perintah otomatis migrate & seeder
            # Menggunakan -T agar tidak butuh TTY di CI
            make docker-both ENV=dev
          debug: true
